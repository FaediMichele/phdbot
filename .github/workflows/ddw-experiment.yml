name: DDW isolated experiment
on:
  push:
    branches: [experiment/ddw-v1]
    paths:
      - 'src/phd_searcher/ddw/**'
      - 'src/phd_searcher/pipeline/schema_quality.py'
      - 'tools/ddw/**'
      - 'tests/ddw/**'
      - '.github/workflows/ddw-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ddw-experiment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      DDW_SOURCE_COMMIT: ${{ github.sha }}
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install only worker dependencies
        run: python -m pip install -r tools/ddw/evidence-requirements.txt
      - name: Isolated contract and interruption tests
        run: |
          python -m unittest discover -s tests/ddw -p test_worker.py -v
          python -m unittest discover -s tests/ddw -p test_html_canary.py -v
          python -m unittest discover -s tests/ddw -p test_evidence_experiment.py -v
      - name: Execute fixture assignment and build portable artifact
        run: python tools/ddw/experiment.py ddw-artifacts
      - name: One explicitly authorized public HTML canary
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[html-canary-20261012]')
        run: timeout 120s python tools/ddw/html_canary.py tools/ddw/html-canary.json ddw-artifacts/html --allow-network
      - name: One missing-evidence assignment with encrypted delivery
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[evidence-canary-20261012]')
        run: timeout 120s python tools/ddw/evidence_experiment.py tools/ddw/evidence-task.json tools/ddw/evidence-recipient.pem ddw-artifacts/evidence --allow-network
      - name: One centrally assigned signed detail
        if: github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[central-ddw-20261014-127502]')
        env:
          DDW_SIGNING_KEY: ${{ secrets.PHDBOT_DDW_SIGNER_20261014_127502 }}
        run: |
          timeout 120s python - <<'PY'
          import hashlib, json, os, sys, tempfile
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ed25519
          sys.path.insert(0, 'tools/ddw')
          from evidence_experiment import execute, read_manifest
          os.umask(0o077)
          signing = os.environ.pop('DDW_SIGNING_KEY', '').encode()
          if not signing:
              raise SystemExit('Missing dedicated assignment signer')
          key = serialization.load_pem_private_key(signing, password=None)
          assert isinstance(key, ed25519.Ed25519PrivateKey)
          public = key.public_key().public_bytes(serialization.Encoding.PEM, serialization.PublicFormat.SubjectPublicKeyInfo)
          manifest = json.loads(Path('tools/ddw/central-assignment.json').read_text())
          assert hashlib.sha256(public).hexdigest() == manifest['signer_sha256']
          assert manifest['context']['assignment_id'] == 'central-20261014-127502'
          assert manifest['context']['attempt'] == 1 and len(manifest['task']['pages']) == 1
          assert set(manifest['robots_sha256']) == set(manifest['task']['allowed_hosts']) == {'jobs.nottingham.ac.uk'}
          manifest['context']['source_commit'] = os.environ['DDW_SOURCE_COMMIT']
          recipient = Path('tools/ddw/central-recipient.pem')
          with tempfile.TemporaryDirectory(prefix='ddw-assigned-') as temporary:
              assignment = Path(temporary) / 'assignment.json'
              assignment.write_text(json.dumps(manifest))
              result = execute(read_manifest(assignment, recipient), recipient.read_bytes(), Path('ddw-artifacts/central'), signing)
          assert result['state'] == 'complete', 'Incomplete result; do not retry'
          print(json.dumps({'state': result['state'], 'pages': len(result['pages']), 'plaintext_exported': False}))
          PY
      - name: Retain bounded public experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ddw-experiment-${{ github.sha }}
          path: ddw-artifacts/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
